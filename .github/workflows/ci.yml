name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.x
        
    - name: Restore dependencies
      run: dotnet restore DevSecOpsDemo.Api.slnx
      
    - name: Build
      run: dotnet build DevSecOpsDemo.Api.slnx --configuration Release --no-restore
      
    - name: Test
      run: dotnet test DevSecOpsDemo.Api.slnx --no-build --configuration Release --verbosity normal
